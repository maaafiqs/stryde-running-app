
name: stryde
description: "Stryde - High performance, athletic, offline-first running tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Geolocation & Background
  geolocator: ^12.0.0
  flutter_background_service: ^5.0.5
  wakelock_plus: ^1.2.5

  # Maps & Geospatial
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Charts & UI
  fl_chart: ^0.68.0
  lucide_icons_flutter: ^4.0.3

  # Utilities & Export
  intl: ^0.19.0
  share_plus: ^9.0.0
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
